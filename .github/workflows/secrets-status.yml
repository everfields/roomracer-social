name: secrets-status

# Publishes which of the publisher's secrets are set: names and yes or no, never a value. RoomRacer's COO return
# (everfields/roomracer, coo-return.yml) cannot list another repo's secrets, so it reads status/secrets.json to verify
# the COO's work. A commit only when the answer changes. GitHub dropped most of the hourly runs (3 in 26 h on 2026-11-12,
# so #23 stayed open with both tokens set), so the PC's 15-minute `social-tick` wakes it too.
on:
  schedule:
    - cron: "41 * * * *"
  repository_dispatch:
    types: [social-tick]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SOCIAL_SECRETS_TOKEN: ${{ secrets.SOCIAL_SECRETS_TOKEN }}
      COS_EVENT_TOKEN: ${{ secrets.COS_EVENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          names = ["INSTAGRAM_ACCESS_TOKEN", "INSTAGRAM_USER_ID", "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET",
                   "YOUTUBE_REFRESH_TOKEN", "BUFFER_API_KEY", "SOCIAL_SECRETS_TOKEN", "COS_EVENT_TOKEN"]
          now = {n: bool(os.environ.get(n, "").strip()) for n in names}
          p = pathlib.Path("status/secrets.json")
          old = json.loads(p.read_text()) if p.is_file() else {}
          if old.get("set") != now:
              p.parent.mkdir(exist_ok=True)
              stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              p.write_text(json.dumps({"set": now, "changed_at": stamp}, indent=2) + "\n")
          PY
          git config user.name secrets-status
          git config user.email actions@users.noreply.github.com
          git add status
          git diff --cached --quiet && exit 0
          git commit --quiet -m "secrets status"
          git pull --quiet --rebase origin main || { git rebase --abort; exit 1; }
          git push --quiet origin HEAD:main
